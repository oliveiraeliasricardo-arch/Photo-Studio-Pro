
name: Build PHOTO STUDIO PRO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Compilar interface
        run: npm run build

      - name: Adicionar Android
        run: npx cap add android

      - name: Copiar plugins personalizados
        run: |
          mkdir -p android/app/src/main/java/com/photostudio/pro
          cp android-patch/app/src/main/java/com/photostudio/pro/*.java android/app/src/main/java/com/photostudio/pro/

      - name: Adicionar permissão da câmera
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PHOTO-STUDIO-PRO
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
