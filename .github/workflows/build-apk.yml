
name: Build PHOTO STUDIO PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar Android
        run: npx cap add android

      - name: Declarar permissão da câmera
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v7
        with:
          name: PHOTO-STUDIO-PRO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
