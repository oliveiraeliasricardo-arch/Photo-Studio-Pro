
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PHOTO STUDIO PRO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:white;font-family:Arial,sans-serif}
button{border:0;color:white;background:transparent;font:inherit;cursor:pointer}
#app{height:100dvh;width:100%;position:relative;overflow:hidden}
.page{display:none;position:absolute;inset:0}
.page.active{display:block}
#cameraPage{background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#video.mirror{transform:scaleX(-1)}
.topbar{position:absolute;top:0;left:0;right:0;padding:40px 18px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#0009,transparent)}
.brand{font-size:13px;font-weight:bold;letter-spacing:1px}
.brand b{color:#d5ad70}
.round{width:42px;height:42px;border-radius:50%;background:#2229;border:1px solid #ffffff55;font-size:20px}
#status{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#0009;padding:7px 13px;border-radius:20px;font-size:11px;white-space:nowrap}
#bottom{position:absolute;bottom:0;left:0;right:0;padding:15px 18px 35px;background:linear-gradient(transparent,#000d)}
.modes{display:flex;justify-content:center;gap:25px;margin-bottom:15px;font-size:12px}
.modes span{color:#bbb}
.modes .active{color:#e8c58d;font-weight:bold}
.filters{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.filter{background:#222c;border:1px solid #ffffff55;border-radius:20px;padding:10px 13px;font-size:12px}
.filter.active{background:#d5ad70;color:#111;font-weight:bold}
.intensity{display:flex;align-items:center;gap:10px;max-width:270px;margin:0 auto 15px;font-size:10px}
input[type=range]{width:100%;accent-color:#d5ad70}
.capture-row{display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;max-width:360px;margin:auto}
.thumb{width:48px;height:48px;border-radius:9px;border:2px solid white;overflow:hidden;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid white;background:#ffffff44;display:grid;place-items:center;justify-self:center}
.shutter:after{content:"";width:52px;height:52px;border-radius:50%;background:white}
.shutter:disabled{opacity:.4}
.gallery-open{justify-self:end;font-size:11px}
.gallery-open span{display:block;font-size:25px}
#galleryPage{background:#101114;overflow:auto;padding:35px 15px}
.gallery-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.gallery-head h2{font-size:21px}
.back{font-size:28px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.photo{background:#222;border-radius:12px;overflow:hidden}
.photo img{width:100%;aspect-ratio:1;object-fit:cover}
.photo-info{padding:9px;font-size:11px;color:#ccc}
.photo-actions{display:flex;gap:5px;padding:0 8px 8px}
.photo-actions button{flex:1;background:#444;border-radius:8px;padding:9px;font-size:11px}
.empty{text-align:center;color:#999;padding:50px 10px}
#toast{display:none;position:absolute;bottom:130px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #555;border-radius:20px;padding:12px 16px;font-size:12px;z-index:9;width:max-content;max-width:90%}
</style>
</head>
<body>
<div id="app">

<section id="cameraPage" class="page active">
<video id="video" autoplay muted playsinline></video>

<div class="topbar">
 <div class="brand">PHOTO <b>STUDIO PRO</b></div>
 <button class="round" id="switchBtn">↻</button>
</div>

<div id="status">Iniciando câmera...</div>

<div id="bottom">
 <div class="modes">
  <span class="active">FOTO</span>
  <span>RETRATO</span>
  <span>VÍDEO</span>
 </div>

 <div class="filters">
  <button class="filter active" data-style="samsung">Samsung Galaxy S</button>
  <button class="filter" data-style="iphone">iPhone</button>
 </div>

 <div class="intensity">
  <span>FILTRO</span>
  <input id="intensity" type="range" min="0" max="100" value="70">
  <span id="intensityValue">70%</span>
 </div>

 <div class="capture-row">
  <button class="thumb" id="lastThumb">
   <img id="lastImage" style="display:none" alt="Última foto">
  </button>
  <button class="shutter" id="captureBtn" disabled aria-label="Fotografar"></button>
  <button class="gallery-open" id="openGallery">
   <span>▦</span>GALERIA
  </button>
 </div>
</div>
</section>

<section id="galleryPage" class="page">
 <div class="gallery-head">
  <button class="back" id="backBtn">‹</button>
  <h2>Minha galeria</h2>
  <span></span>
 </div>
 <div id="gallery" class="grid"></div>
 <div id="emptyGallery" class="empty">Suas fotos aparecerão aqui.</div>
</section>

<div id="toast"></div>
</div>

<script type="module">
import { registerPlugin } from '@capacitor/core';

const GallerySaver = registerPlugin('GallerySaver');

const $ = id => document.getElementById(id);
const video = $('video');
const captureBtn = $('captureBtn');

let stream = null;
let facing = 'environment';
let selectedStyle = 'samsung';
let intensity = 70;
let db = null;
let busy = false;

function toast(message) {
 const el = $('toast');
 el.textContent = message;
 el.style.display = 'block';
 clearTimeout(toast.timer);
 toast.timer = setTimeout(() => el.style.display = 'none', 2800);
}

function openDB() {
 return new Promise((resolve,reject) => {
  const req = indexedDB.open('PhotoStudioProDB',1);
  req.onupgradeneeded = e => {
   e.target.result.createObjectStore('photos',{
    keyPath:'id',autoIncrement:true
   });
  };
  req.onsuccess = () => {
   db = req.result;
   resolve();
  };
  req.onerror = () => reject(req.error);
 });
}

async function startCamera() {
 try {
  stopCamera();

  stream = await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:facing},
    width:{ideal:1920},
    height:{ideal:1080}
   }
  });

  video.srcObject = stream;
  await video.play();
  video.classList.toggle('mirror',facing === 'user');
  captureBtn.disabled = false;
  $('status').textContent =
   facing === 'user' ? 'Câmera frontal' : 'Câmera traseira';

  applyLiveFilter();

 } catch(error) {
  $('status').textContent = 'Erro ao abrir câmera';
  toast('Verifique a permissão da câmera.');
 }
}

function stopCamera() {
 if(stream) {
  stream.getTracks().forEach(track => track.stop());
  stream = null;
 }
 video.srcObject = null;
 captureBtn.disabled = true;
}

$('switchBtn').onclick = async () => {
 facing = facing === 'environment' ? 'user' : 'environment';
 await startCamera();
};

function filterValues() {
 const amount = intensity / 100;
 const values = selectedStyle === 'samsung'
  ? [1.04,1.16,1.20]
  : [1.03,1.06,1.07];

 return values.map(v => 1 + (v-1)*amount);
}

function applyLiveFilter() {
 intensity = Number($('intensity').value);
 $('intensityValue').textContent = intensity + '%';
 const [b,c,s] = filterValues();

 video.style.filter =
  `brightness(${b}) contrast(${c}) saturate(${s})`;
}

$('intensity').oninput = applyLiveFilter;

document.querySelectorAll('.filter').forEach(button => {
 button.onclick = () => {
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
  button.classList.add('active');
  selectedStyle = button.dataset.style;
  applyLiveFilter();
 };
});

function capturePhoto() {
 const canvas = document.createElement('canvas');
 canvas.width = video.videoWidth;
 canvas.height = video.videoHeight;

 const ctx = canvas.getContext('2d');

 if(facing === 'user') {
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(video,0,0,canvas.width,canvas.height);

 return new Promise((resolve,reject) => {
  canvas.toBlob(blob => {
   if(blob) resolve(blob);
   else reject(new Error('Falha na captura.'));
  },'image/jpeg',0.96);
 });
}

async function processPhoto(blob) {
 const url = URL.createObjectURL(blob);

 try {
  const img = new Image();
  img.src = url;
  await img.decode();

  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;

  const ctx = canvas.getContext('2d');
  const [b,c,s] = filterValues();

  ctx.filter = `brightness(${b}) contrast(${c}) saturate(${s})`;
  ctx.drawImage(img,0,0);

  return await new Promise((resolve,reject) => {
   canvas.toBlob(result => {
    if(result) resolve(result);
    else reject(new Error('Falha no filtro.'));
   },'image/jpeg',0.96);
  });

 } finally {
  URL.revokeObjectURL(url);
 }
}

function blobToBase64(blob) {
 return new Promise((resolve,reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(String(reader.result).split(',')[1]);
  reader.onerror = reject;
  reader.readAsDataURL(blob);
 });
}

async function saveToGallery(blob,fileName) {
 const data = await blobToBase64(blob);

 const result = await GallerySaver.save({
  data,
  fileName,
  mimeType:'image/jpeg'
 });

 if(!result || !result.uri) {
  throw new Error('O Android não confirmou o salvamento.');
 }
}

function saveLocal(original,edited) {
 return new Promise((resolve,reject) => {
  const tx = db.transaction('photos','readwrite');
  tx.objectStore('photos').add({
   original,
   edited,
   style:selectedStyle,
   intensity,
   date:new Date().toISOString()
  });
  tx.oncomplete = resolve;
  tx.onerror = () => reject(tx.error);
 });
}

captureBtn.onclick = async () => {
 if(!stream || busy) return;

 busy = true;
 captureBtn.disabled = true;

 try {
  const original = await capturePhoto();
  const edited = await processPhoto(original);
  const stamp = new Date().toISOString().replace(/[:.]/g,'-');

  await saveToGallery(edited,'PhotoStudio-'+stamp+'.jpg');
  await saveToGallery(original,'PhotoStudio-original-'+stamp+'.jpg');
  await saveLocal(original,edited);

  await renderGallery();
  setLastPhoto(edited);

  toast('Foto original e editada salvas na galeria!');

 } catch(error) {
  toast('Erro ao salvar: '+error.message);
 } finally {
  busy = false;
  captureBtn.disabled = !stream;
 }
};

function setLastPhoto(blob) {
 const url = URL.createObjectURL(blob);
 $('lastImage').src = url;
 $('lastImage').style.display = 'block';
}

function getPhotos() {
 return new Promise((resolve,reject) => {
  const req = db.transaction('photos','readonly')
   .objectStore('photos').getAll();
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
 });
}

async function renderGallery() {
 const photos = (await getPhotos()).reverse();
 $('gallery').innerHTML = '';
 $('emptyGallery').style.display = photos.length ? 'none' : 'block';

 photos.forEach(photo => {
  const card = document.createElement('div');
  card.className = 'photo';

  const img = document.createElement('img');
  img.src = URL.createObjectURL(photo.edited);

  const info = document.createElement('div');
  info.className = 'photo-info';
  info.textContent =
   (photo.style === 'samsung' ? 'Samsung Galaxy S' : 'iPhone')+
   ' • '+photo.intensity+'%';

  const actions = document.createElement('div');
  actions.className = 'photo-actions';

  const original = document.createElement('button');
  original.textContent = 'Ver original';
  original.onclick = () => showBlob(photo.original);

  const edited = document.createElement('button');
  edited.textContent = 'Ver editada';
  edited.onclick = () => showBlob(photo.edited);

  actions.append(original,edited);
  card.append(img,info,actions);
  $('gallery').append(card);
 });
}

function showBlob(blob) {
 const url = URL.createObjectURL(blob);
 const link = document.createElement('a');
 link.href = url;
 link.target = '_blank';
 link.click();
 setTimeout(() => URL.revokeObjectURL(url),30000);
}

function showPage(id) {
 document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
 $(id).classList.add('active');
}

$('openGallery').onclick = async () => {
 await renderGallery();
 showPage('galleryPage');
};

$('lastThumb').onclick = async () => {
 await renderGallery();
 showPage('galleryPage');
};

$('backBtn').onclick = () => showPage('cameraPage');

await openDB();
await renderGallery();
await startCamera();

document.addEventListener('visibilitychange',() => {
 if(document.hidden) stopCamera();
 else if($('cameraPage').classList.contains('active')) startCamera();
});
</script>
</body>
</html>
